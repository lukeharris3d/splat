<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waterfall</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>

    <!-- Import map for Three.js and Spark.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { ARButton } from "three/addons/webxr/ARButton.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
      import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

      // Contrast Adaptive Sharpening (CAS) shader
      const CASSharpenShader = {
        uniforms: {
          tDiffuse: { value: null },
          uTexelSize: { value: new THREE.Vector2(1 / window.innerWidth, 1 / window.innerHeight) },
          uSharpness: { value: 0.5 }, // 0.0 (off) to 1.0 (strong)
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform sampler2D tDiffuse;
          uniform vec2 uTexelSize;
          uniform float uSharpness;
          varying vec2 vUv;

          void main() {
            vec4 center = texture2D(tDiffuse, vUv);
            vec3 c = center.rgb;
            vec3 n = texture2D(tDiffuse, vUv + vec2(0.0, uTexelSize.y)).rgb;
            vec3 s = texture2D(tDiffuse, vUv - vec2(0.0, uTexelSize.y)).rgb;
            vec3 e = texture2D(tDiffuse, vUv + vec2(uTexelSize.x, 0.0)).rgb;
            vec3 w = texture2D(tDiffuse, vUv - vec2(uTexelSize.x, 0.0)).rgb;

            vec3 minRGB = min(c, min(min(n, s), min(e, w)));
            vec3 maxRGB = max(c, max(max(n, s), max(e, w)));

            vec3 amp = clamp(min(minRGB, 1.0 - maxRGB) / max(maxRGB, vec3(1e-5)), 0.0, 1.0);
            amp = sqrt(amp);
            vec3 weight = amp * (-uSharpness * 0.2);

            vec3 result = clamp((c + (n + s + e + w) * weight) / (1.0 + 4.0 * weight), 0.0, 1.0);
            gl_FragColor = vec4(result, center.a);
          }
        `,
      };

      // 1. Setup Scene and Camera
      const scene = new THREE.Scene();
      const defaultBg = new THREE.Color(0x000000);
      scene.background = defaultBg;

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );
      camera.position.set(0.5, 1, -2);

      // 2. Setup WebGLRenderer with HiDPI + Neutral Tone Mapping
      const renderer = new THREE.WebGLRenderer({
        antialias: false,
        alpha: true,
      });
      const pixelRatio = Math.min(window.devicePixelRatio, 2);
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.NeutralToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Add the Mobile AR Button to the page
      const arButton = ARButton.createButton(renderer, {
        optionalFeatures: ["local-floor", "bounded-floor", "hit-test"],
      });
      document.body.appendChild(arButton);

      renderer.xr.addEventListener("sessionstart", () => {
        scene.background = null;
      });
      renderer.xr.addEventListener("sessionend", () => {
        scene.background = defaultBg;
      });

      // 3. Add Grid and Axes Helpers
      const grid = new THREE.GridHelper(1, 4, 0x444444, 0x222222);
      scene.add(grid);

      const axes = new THREE.AxesHelper(0.15);
      scene.add(axes);

      // 4. Initialize SparkRenderer with sharper splat settings
      const spark = new SparkRenderer({
        renderer,
        focalAdjustment: 1.2, // Try 1.0 (default) to 2.0 (sharper)
        blurAmount: 0.2,      // Try 0.3 (softer AA) down to 0.0 (crispiest)
      });
      scene.add(spark);

      // 5. Setup Post-Processing: Render -> Neutral Tone Mapping -> CAS Sharpen
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new OutputPass());

      const sharpenPass = new ShaderPass(CASSharpenShader);
      const drawingSize = new THREE.Vector2();
      renderer.getDrawingBufferSize(drawingSize);
      sharpenPass.uniforms.uTexelSize.value.set(1 / drawingSize.x, 1 / drawingSize.y);
      composer.addPass(sharpenPass);

      // 6. Setup OrbitControls
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.5, 0);
      controls.enableDamping = true;

      // 7. Load the .spz file
      const splatURL =
        "https://raw.githubusercontent.com/lukeharris3d/splat/main/spz/waterfall.spz";
      const splat = new SplatMesh({
        url: splatURL,
        onLoad: (mesh) => {
          mesh.rotation.z = Math.PI;
          mesh.updateMatrixWorld();

          const box = mesh.getBoundingBox(true);
          const center = new THREE.Vector3();
          box.getCenter(center);
          mesh.position.sub(center);

          mesh.position.x -= 0;
          mesh.position.y -= 0.3;
          mesh.position.z -= 0;
        },
      });
      scene.add(splat);

      // 8. Handle window resizing
      window.addEventListener("resize", () => {
        const pr = Math.min(window.devicePixelRatio, 2);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setPixelRatio(pr);
        renderer.setSize(window.innerWidth, window.innerHeight);

        composer.setPixelRatio(pr);
        composer.setSize(window.innerWidth, window.innerHeight);

        renderer.getDrawingBufferSize(drawingSize);
        sharpenPass.uniforms.uTexelSize.value.set(1 / drawingSize.x, 1 / drawingSize.y);
      });

      // 9. Render loop
      renderer.setAnimationLoop(() => {
        if (!renderer.xr.isPresenting) {
          controls.update();
          composer.render();
        } else {
          renderer.render(scene, camera);
        }
      });
    </script>
  </body>
</html>
