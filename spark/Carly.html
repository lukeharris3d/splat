<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carly_form-1</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #fff;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>

    <!-- Import map for Three.js and Spark.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { ARButton } from "three/addons/webxr/ARButton.js";
      import { SparkRenderer, SplatMesh } from "@sparkjsdev/spark";

      // 1. Setup Scene and Camera
      const scene = new THREE.Scene();
      const defaultBg = new THREE.Color(0xffffff);
      scene.background = defaultBg;

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );
      camera.position.set(0.4, 0.7, 1);

      // 2. Setup WebGLRenderer with antialias: false and alpha: true (required for AR camera passthrough)
      const renderer = new THREE.WebGLRenderer({
        antialias: false,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true; // Enable WebXR
      document.body.appendChild(renderer.domElement);

      // Add the Mobile AR Button to the page
      const arButton = ARButton.createButton(renderer, {
        optionalFeatures: ["local-floor", "bounded-floor", "hit-test"],
      });
      document.body.appendChild(arButton);

      // Remove solid background when entering AR so phone camera feed is visible
      renderer.xr.addEventListener("sessionstart", () => {
        scene.background = null;
      });

      // Restore dark grey background when exiting AR
      renderer.xr.addEventListener("sessionend", () => {
        scene.background = defaultBg;
      });

      // 3. Add Grid and Axes Helpers at the origin (0, 0, 0)
      const grid = new THREE.GridHelper(1, 4, 0x444444, 0x222222);
      scene.add(grid);

      const axes = new THREE.AxesHelper(0.15); // Red = X, Green = Y, Blue = Z
      scene.add(axes);

      // 4. Initialize SparkRenderer
      const spark = new SparkRenderer({ renderer });
      scene.add(spark);

      // 5. Setup OrbitControls targeting the origin (0, 0, 0)
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.2, 0);
      controls.enableDamping = true;

      // 6. Load the .spz file, flip it right-side up, and center it at (0, 0, 0)
      const splatURL =
        "https://raw.githubusercontent.com/lukeharris3d/splat/main/spz/form1.spz";
      const splat = new SplatMesh({
        url: splatURL,
        onLoad: (mesh) => {
          // Flip 180 degrees around Z so depth (Z) stays in front of the camera
          mesh.rotation.z = Math.PI;
          mesh.updateMatrixWorld();

          // Move the splat's bounding-box center to (0, 0, 0)
          const box = mesh.getBoundingBox(true);
          const center = new THREE.Vector3();
          box.getCenter(center);
          mesh.position.sub(center);

          // Drop the splat 0.1 on X and 0.15 on Y
          mesh.position.x -= 0;
          mesh.position.y -= 0.3;
          mesh.position.z -= 0;
        },
      });
      scene.add(splat);

      // 7. Handle window resizing
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // 8. Render loop
      renderer.setAnimationLoop(() => {
        // Only apply OrbitControls when NOT in an active AR session
        if (!renderer.xr.isPresenting) {
          controls.update();
        }

        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
